<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - LifeBuild</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1 class="bem_vindo">Redefinir senha</h1>
    <div class="box-login">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, msg in messages %}
                <div class="info {{ category }}">{{ msg }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form class="form" method="POST" action="{{ url_for('reset_password', token=token) }}">
            <label for="senha">Nova senha:</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="senha" name="senha" placeholder="Digite a nova senha" required>
            </div>
            <button type="submit">Redefinir senha</button>
            <div class="cadastro-link"><a href="{{ url_for('login') }}">Voltar ao login</a></div>
        </form>
    </div>
</body>
</html>
